name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
        
    - name: Sync dependencies
      run: uv sync
      
    - name: Lint and Format
      run: |
        uv run ruff check .
        uv run ruff format --check .
        
    - name: Type check (Core)
      run: uv run mypy packages/core
        
    - name: Run unit & property tests
      run: uv run pytest tests/unit tests/property
      
    - name: Run golden trip tests
      run: uv run pytest tests/golden
