[project]
name = "voltrail-adapters"
version = "0.1.0"
description = "Adapters for Voltrail"
requires-python = ">=3.12"
dependencies = [
    "voltrail-core",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "polyline>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
voltrail-core = { workspace = true }
